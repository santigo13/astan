<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosco — BUILD YOUR DREAM PC</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#040208;color:#f3eeff;font-family:'Segoe UI',system-ui,sans-serif;text-align:center;padding:24px}
.box{max-width:520px;display:grid;gap:14px;justify-items:center}
h1{font-size:1.4rem;margin:0}
p{color:#b3a6d6;font-size:.9rem;margin:0}
.btn{min-height:52px;padding:12px 22px;border-radius:14px;font-weight:800;font-size:1rem;cursor:pointer;color:#04060f;border:0;background:linear-gradient(100deg,#a855f7,#d946ef,#6366f1)}
.ghost{background:rgba(255,255,255,.06);color:#f3eeff;border:1px solid rgba(168,85,247,.4)}
small{color:#8477a6}
</style>
</head>
<body>
<div class="box">
  <h1>🖥️ Modo Kiosco</h1>
  <p>Abre el armador directamente en modo kiosco (pantalla grande, sin admin). Una sola fuente: <b>index.html#kiosk</b>.</p>
  <button class="btn" id="go">Abrir kiosco</button>
  <button class="btn ghost" id="fs">Abrir kiosco en pantalla completa</button>
  <small>Si no redirige solo, tocá el botón. Para salir del kiosco, sacá el #kiosk de la URL.</small>
</div>
<script>
var target = "index.html#kiosk";
document.getElementById("go").onclick = function(){ location.href = target; };
document.getElementById("fs").onclick = function(){
  try {
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } catch(e){}
  location.href = target;
};
setTimeout(function(){ location.replace(target); }, 1200);
</script>
</body>
</html>
