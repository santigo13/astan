<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#040208">
<title>BUILD YOUR DREAM PC — What is your FPS?</title>
<style>
:root{
  --tb:150px;
  --bg:#040208; --bg2:#0a0514; --panel:rgba(26,15,45,.88); --panel2:rgba(38,22,64,.95);
  --stroke:rgba(168,85,247,.22); --stroke2:rgba(192,132,252,.38);
  --txt:#f3eeff; --muted:#b3a6d6; --dim:#8477a6;
  --violet:#a855f7; --purple:#8b5cf6; --fuchsia:#d946ef; --indigo:#818cf8; --lav:#c4b5fd;
  --cyan:#a855f7; --magenta:#d946ef; --lime:#c084fc;
  --amber:#fbbf24; --red:#fb7185;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  --r:16px; --r2:22px; --sh:0 8px 22px rgba(0,0,0,.35);
  --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff); color:var(--txt); background:var(--bg); min-height:100vh;
  background-image:
    radial-gradient(1000px 640px at 12% -10%, rgba(139,92,246,.11), transparent 60%),
    radial-gradient(820px 720px at 100% 120%, rgba(99,102,241,.08), transparent 60%),
    linear-gradient(180deg,#040208,#0a0514 42%,#040208);
  overflow-x:hidden;
}
#particles{position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.26}
.wrap{position:relative; z-index:2; max-width:1500px; margin:0 auto; padding:14px; padding-top:calc(var(--tb) + 18px)}
body.lite #particles{display:none}
body.lite .float{animation:none!important}

.glass{
  background:linear-gradient(180deg,var(--panel),rgba(12,7,24,.9));
  border:1px solid var(--stroke); border-radius:var(--r2);
  box-shadow:var(--sh);
}
.topbar{
  position:sticky; top:8px; z-index:40; display:flex; flex-direction:column; gap:10px;
  padding:14px 16px; margin-bottom:16px;
  backdrop-filter:blur(12px) saturate(130%); -webkit-backdrop-filter:blur(12px) saturate(130%);
}
.brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.logo{
  width:46px;height:46px;border-radius:14px; flex:0 0 auto; position:relative;
  background:linear-gradient(150deg,var(--violet),var(--indigo));
  display:grid; place-items:center; box-shadow:0 0 12px rgba(168,85,247,.28);
}
.logo b{width:36px;height:36px;border-radius:10px;background:#0a0514;display:grid;place-items:center;font-size:18px;color:#e9d5ff}
h1{font-size:clamp(1.05rem,3.6vw,1.55rem); margin:0; letter-spacing:.4px; line-height:1.1}
h1 span{background:linear-gradient(90deg,var(--lav),var(--violet),var(--fuchsia)); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{color:var(--muted); font-size:.78rem; margin-top:3px}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.spacer{flex:1}
.chipset{display:flex; gap:8px; flex-wrap:wrap}

button,.btn{font-family:inherit}
.btn{
  min-height:48px; padding:10px 16px; border-radius:14px; cursor:pointer; font-weight:700; font-size:.86rem;
  color:var(--txt); border:1px solid var(--stroke2); background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  display:inline-flex; align-items:center; gap:8px; justify-content:center; position:relative; overflow:hidden;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.4), box-shadow .2s, border-color .2s, background .2s;
}
.btn:hover{transform:translateY(-1px); border-color:var(--violet); box-shadow:0 6px 16px rgba(168,85,247,.2)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
.btn.sm{min-height:48px; padding:8px 12px; font-size:.78rem; border-radius:12px}
.presets{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.presets .btn{flex:1; min-width:120px}
.btn.primary{border-color:transparent; background:linear-gradient(100deg,var(--cyan),var(--violet) 55%,var(--magenta)); color:#04060f}
.btn.lime{background:linear-gradient(100deg,var(--lime),var(--cyan)); color:#04060f; border-color:transparent}
.btn.ghost{background:rgba(255,255,255,.04)}
.btn.danger{border-color:var(--red); color:#ffd7de}
.btn[aria-pressed="true"]{border-color:var(--violet); box-shadow:0 0 0 2px rgba(168,85,247,.4) inset}
.ripple{position:absolute; border-radius:50%; transform:scale(0); background:rgba(255,255,255,.55); pointer-events:none; animation:ripple .6s linear; mix-blend-mode:screen}
@keyframes ripple{to{transform:scale(3.4); opacity:0}}

.layout{display:grid; grid-template-columns:1fr; gap:16px}
@media(min-width:1000px){.layout{grid-template-columns:minmax(0,1.55fr) minmax(340px,.95fr); align-items:start}}
.col-right{position:static; display:flex; flex-direction:column; gap:16px; max-height:none; overflow:visible}
@media(min-width:1000px){
  .col-right{position:sticky; top:calc(var(--tb) + 12px); max-height:calc(100vh - var(--tb) - 24px); max-height:calc(100dvh - var(--tb) - 24px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.35) transparent; padding-bottom:4px}
  .col-right::-webkit-scrollbar{width:5px}
  .col-right::-webkit-scrollbar-track{background:transparent}
  .col-right::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35); border-radius:4px}
  .col-right::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.55)}
}

.section{padding:14px 15px; margin-bottom:14px; border-radius:var(--r2); content-visibility:auto; contain-intrinsic-size:auto 300px}
.sec-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.sec-head h2{font-size:1rem; margin:0; letter-spacing:.3px}
.sec-head .ico{font-size:1.15rem}
.sec-head .hint{color:var(--dim); font-size:.72rem; font-weight:600}
.pillgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:9px}
.opt{
  position:relative; text-align:left; border-radius:15px; cursor:pointer; padding:11px 12px; color:var(--txt);
  border:1px solid var(--stroke); background:linear-gradient(180deg,rgba(168,85,247,.06),rgba(255,255,255,.012));
  transition:transform .18s, border-color .2s, box-shadow .2s, background .2s; min-height:48px; overflow:hidden;
  display:flex; flex-direction:column; gap:6px;
}
.opt:hover{transform:translateY(-2px); border-color:var(--stroke2); box-shadow:0 6px 16px rgba(0,0,0,.35)}
.opt:focus-visible{outline:3px solid var(--fuchsia); outline-offset:2px}
.opt.sel{border-color:var(--violet); background:linear-gradient(180deg,rgba(168,85,247,.14),rgba(139,92,246,.08)); box-shadow:0 0 0 1px var(--violet) inset}

.opt .nm{font-weight:700; font-size:.84rem; line-height:1.25; padding-right:20px; word-break:break-word}
.opt .spec{color:var(--muted); font-size:.71rem; display:flex; gap:5px; flex-wrap:wrap}
.opt .pr{font-size:.8rem; font-weight:800; color:var(--lav); margin-top:auto}
.tag{display:inline-block; font-size:.64rem; padding:2px 6px; border-radius:7px; background:rgba(168,85,247,.1); border:1px solid var(--stroke); color:var(--muted)}
.tag.d4{border-color:rgba(129,140,248,.55); color:#d6d9ff}
.tag.d5{border-color:rgba(217,70,239,.55); color:#ffd9fb}
.tag.warn{border-color:rgba(251,191,36,.6); color:#ffe6ab}
.tag.bad{border-color:rgba(251,113,133,.6); color:#ffcdd5}

.casebox{padding:12px}
.case-stage{
  position:relative; border-radius:16px; padding:12px; overflow:hidden;
  background:linear-gradient(180deg,rgba(10,12,22,.85),rgba(6,8,15,.85)); border:1px solid var(--stroke);
}
.case-frame{position:relative; height:210px; border-radius:12px; border:2px solid var(--stroke2); background:
  linear-gradient(180deg,rgba(255,255,255,.02),transparent), repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.022) 18px 19px);
}
.slot{position:absolute; border-radius:8px; border:1px dashed rgba(192,132,252,.28); display:grid; place-items:center;
  font-size:.6rem; color:var(--dim); text-align:center; transition:all .35s ease; padding:2px 4px; line-height:1.1;
  overflow:hidden; word-break:break-word}
.slot.filled{border-style:solid; opacity:1; box-shadow:0 0 16px rgba(168,85,247,.5); color:#0a0514; font-weight:800}
.slot.filled.cpu{background:linear-gradient(160deg,var(--violet),var(--purple))}
.slot.filled.mobo{background:linear-gradient(160deg,#3b2a5e,#1a1030); color:#e9d5ff}
.slot.filled.ram{background:linear-gradient(160deg,var(--lav),var(--indigo))}
.slot.filled.gpu{background:linear-gradient(160deg,var(--fuchsia),var(--violet))}
.slot.filled.psu{background:linear-gradient(160deg,#fcd34d,#b45309)}
.slot.filled.cooling{background:linear-gradient(160deg,#a5b4fc,#6366f1)}
.slot.filled.storage{background:linear-gradient(160deg,#d8b4fe,#7c3aed)}
.slot.filled.case{background:linear-gradient(160deg,#6d28d9,#2e1065); color:#e9d5ff}
.float{animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.case-cap{display:flex; justify-content:space-between; color:var(--muted); font-size:.72rem; margin-top:8px; flex-wrap:wrap; gap:6px}

.summary{padding:14px}
.sumrow{display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:5px 0; border-bottom:1px dashed rgba(255,255,255,.07)}
.sumrow:last-child{border-bottom:0}
.sumrow .k{color:var(--muted); font-size:.8rem}
.sumrow .v{font-weight:800; font-size:.92rem}
.bigprice{font-size:clamp(1.5rem,6vw,2.1rem); font-weight:900; letter-spacing:.5px}
.ars{color:var(--lime)} .usd{color:var(--cyan)}
.rate{display:flex; gap:8px; align-items:center; margin-top:8px}
.rate input{flex:1; min-height:44px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(0,0,0,.35); color:var(--txt); padding:8px 12px; font-size:.9rem}
input,select{font-family:inherit}
input:focus-visible,select:focus-visible{outline:3px solid var(--cyan); outline-offset:1px}

.comp-list{display:flex; flex-direction:column; gap:7px; margin-top:4px}
.comp{display:flex; gap:9px; align-items:center; padding:8px 10px; border-radius:12px; background:rgba(255,255,255,.035); border:1px solid var(--stroke); font-size:.78rem}
.comp .st{width:22px;height:22px;border-radius:50%; display:grid; place-items:center; flex:0 0 auto; font-size:.72rem; font-weight:900; color:#04060f}
.comp.ok .st{background:var(--ok)} .comp.warn .st{background:var(--warn)} .comp.bad .st{background:var(--bad)}
.comp.ok{border-color:rgba(52,211,153,.4)} .comp.warn{border-color:rgba(251,191,36,.4)} .comp.bad{border-color:rgba(251,113,133,.45)}
.comp .tx{color:var(--muted)} .comp .tx b{color:var(--txt)}

.actions{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px}
.actions .wide{grid-column:1/-1}

.bench{padding:20px; text-align:center}
.bench .bar{height:12px; border-radius:20px; background:rgba(255,255,255,.08); overflow:hidden; margin:16px 0}
.bench .bar i{display:block; height:100%; width:0; border-radius:20px; background:linear-gradient(90deg,var(--cyan),var(--lime),var(--magenta)); transition:width .25s linear}
.bench .log{font-family:ui-monospace,Consolas,monospace; font-size:.74rem; color:var(--muted); height:64px; overflow:hidden; text-align:left; margin-top:6px}
.bench .log div{opacity:.85}
.bench .pct{font-size:2.3rem; font-weight:900; background:linear-gradient(90deg,var(--cyan),var(--lime)); -webkit-background-clip:text; background-clip:text; color:transparent}

.modal{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; padding:14px; overflow:auto;
  background:rgba(3,4,10,.72); backdrop-filter:blur(8px)}
.modal.open{display:flex; animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal .box{width:100%; max-width:1080px; margin:auto; padding:18px; position:relative; animation:pop .3s cubic-bezier(.2,.9,.3,1.3);
  backdrop-filter:blur(12px) saturate(130%); -webkit-backdrop-filter:blur(12px) saturate(130%)}
@keyframes pop{from{transform:scale(.92) translateY(14px); opacity:0}to{transform:none; opacity:1}}
.modal .box.slim{max-width:560px}
.close{position:absolute; top:12px; right:12px}
.result-grid{display:grid; grid-template-columns:1fr; gap:14px}
@media(min-width:820px){.result-grid{grid-template-columns:1fr 1fr}}
.card{padding:14px; border-radius:var(--r); border:1px solid var(--stroke); background:linear-gradient(180deg,rgba(168,85,247,.07),rgba(255,255,255,.015))}
.card h3{margin:0 0 10px; font-size:.9rem; letter-spacing:.3px; display:flex; gap:8px; align-items:center}
.gauge{display:flex; gap:14px; align-items:center; flex-wrap:wrap}
.dial{--p:0; --c1:var(--violet); --c2:var(--fuchsia); width:clamp(96px,26vw,116px); height:clamp(96px,26vw,116px); border-radius:50%; flex:0 0 auto; position:relative;
  background:conic-gradient(var(--c1) calc(var(--p)*1%), rgba(255,255,255,.08) 0); display:grid; place-items:center}
.dial::before{content:""; position:absolute; inset:11px; border-radius:50%; background:var(--bg2); border:1px solid var(--stroke)}
.dial .val{position:relative; z-index:1; text-align:center; padding:0 6px}
.dial .val b{font-size:clamp(1.15rem,4.4vw,1.5rem); display:block; line-height:1}
.dial .val span{font-size:.6rem; color:var(--muted); display:block; margin-top:2px}
.gauge .legend{flex:1 1 160px; min-width:0}
.legend .lr{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.78rem; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.07)}
.legend .lr:last-child{border-bottom:0}
.legend .lr>span{flex:1 1 auto; min-width:0}
.legend .lr b{text-align:right; flex:0 1 auto; min-width:0; overflow-wrap:anywhere}
.legend .lr .k{color:var(--muted)}
.badge{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font-size:.7rem; font-weight:800; border:1px solid var(--stroke2); white-space:nowrap}
.badge.notgood{background:rgba(251,113,133,.18); border-color:var(--red); color:#ffd7de}
.badge.playable{background:rgba(251,191,36,.16); border-color:var(--amber); color:#ffe6ab}
.badge.decent{background:rgba(52,211,153,.16); border-color:var(--ok); color:#c8ffe8}
.badge.great{background:rgba(168,85,247,.2); border-color:var(--violet); color:#eadcff}
.badge.excellent{background:linear-gradient(90deg,rgba(168,85,247,.3),rgba(217,70,239,.3)); border-color:var(--fuchsia); color:#ffe3fd}
.fps-row{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:5px 8px; padding:7px 0; border-bottom:1px dashed rgba(255,255,255,.07)}
.fps-row:last-child{border-bottom:0}
.fps-row .gname{font-weight:700; font-size:.82rem; flex:1 1 100px; min-width:0; word-break:break-word}
.fps-row .fps{font-weight:900; font-size:.98rem; color:var(--lav); text-align:right; white-space:nowrap}
.fps-row .mini{color:var(--dim); font-size:.66rem; text-align:right; white-space:nowrap}
.fps-row .badge{margin-left:auto}
.fps-row .fbar{flex:1 1 100%; height:5px; border-radius:4px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:2px}
.fps-row .fbar i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,var(--cyan),var(--violet))}
.result-grid .card.hero{grid-column:1/-1}
.hero h3{justify-content:center}
.bigscore{display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center}
.verdictbox{text-align:center}
.verdictline{display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap; font-size:.86rem}
.verdictline>span{color:var(--muted)}
.verdictsub{color:var(--muted); font-size:.74rem; margin-top:6px}
.statstrip{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:9px; margin-top:16px}
.stat{padding:9px 11px; border-radius:12px; border:1px solid var(--stroke); background:rgba(255,255,255,.03)}
.stat b{display:block; font-size:1.02rem; color:var(--lav)}
.stat span{display:block; color:var(--dim); font-size:.62rem; text-transform:uppercase; letter-spacing:.5px; margin-top:2px}
.upgradeline{margin-top:14px; font-size:.78rem; color:var(--muted); border-top:1px dashed rgba(255,255,255,.08); padding-top:10px; overflow-wrap:anywhere}
.sec-head .multi{color:var(--dim); font-size:.7rem; font-weight:600}
.tbl-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}

.saved{display:flex; flex-direction:column; gap:8px}
.saveditem{padding:10px; border-radius:12px; border:1px solid var(--stroke); background:rgba(255,255,255,.04); font-size:.76rem; display:flex; gap:8px; align-items:center; justify-content:space-between}
.saveditem .m{color:var(--muted); font-size:.7rem}
.cmp-grid{overflow:auto; margin-top:10px}
.cmp-grid table{border-collapse:collapse; width:100%; font-size:.76rem; min-width:520px}
.cmp-grid th,.cmp-grid td{border:1px solid var(--stroke); padding:7px 9px; text-align:left}
.cmp-grid th{color:var(--muted); background:rgba(255,255,255,.04)}
.cmp-grid .win{color:var(--lime); font-weight:900}

.glossary{display:grid; grid-template-columns:1fr; gap:10px}
@media(min-width:700px){.glossary{grid-template-columns:1fr 1fr}}
.gcard{padding:14px 16px; border-radius:16px; border:1px solid var(--stroke2); min-height:150px;
  background:linear-gradient(150deg,rgba(139,92,246,.2),rgba(217,70,239,.14));
  display:flex; flex-direction:column; justify-content:center; gap:8px}
.gcard .term{font-size:1.15rem; font-weight:900; background:linear-gradient(90deg,var(--violet),var(--fuchsia)); -webkit-background-clip:text; background-clip:text; color:transparent}
.gcard .def{font-size:.85rem; color:#e6ddff; line-height:1.45}
.gcard .cat{font-size:.66rem; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px}

.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(90px); z-index:200; padding:12px 18px; border-radius:14px;
  background:rgba(15,18,32,.95); border:1px solid var(--cyan); color:var(--txt); font-weight:700; font-size:.84rem; box-shadow:var(--sh); transition:transform .35s}
.toast.show{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed; inset:0; z-index:150; pointer-events:none; display:none}
#confetti.on{display:block}

.kiosk-note{color:var(--dim); font-size:.7rem}
.badge-count{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:rgba(168,85,247,.16); border:1px solid rgba(168,85,247,.45); color:#eadcff; font-size:.72rem; font-weight:800}

.printsheet{display:none}
@media print{
  body{background:#fff; color:#000}
  body *{visibility:hidden!important}
  .printsheet,.printsheet *{visibility:visible!important}
  .printsheet{display:block!important; position:absolute; inset:0; padding:22px; color:#000; background:#fff}
  .printsheet table{width:100%; border-collapse:collapse; font-size:12px}
  .printsheet th,.printsheet td{border:1px solid #333; padding:6px 8px; text-align:left}
  .printsheet h1{font-size:20px; margin:0 0 4px}
  .printsheet .ph{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:10px}
  .printsheet .num{font-weight:900; border:2px solid #000; padding:6px 10px; border-radius:8px; font-size:16px}
}

body.kiosk{font-size:1.16rem}
body.kiosk .wrap{max-width:1700px}
body.kiosk .opt{min-height:60px}
body.kiosk .btn{min-height:56px; font-size:.98rem}
body.kiosk .pillgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
body.kiosk .hide-kiosk{display:none!important}
body.kiosk #langBtn{display:inline-flex!important}
a.btn{text-decoration:none}
body.kiosk .col-right{top:calc(var(--tb) + 12px)}

body.techmode .techonly{display:block!important}
.techonly{display:none}
.techphrase{padding:14px; border-radius:16px; border:1px solid var(--violet); background:linear-gradient(140deg,rgba(139,92,246,.16),rgba(217,70,239,.12)); font-size:1rem; line-height:1.5}
.techphrase b{color:var(--lav)}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important}
  #particles{display:none}
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.adminfield{display:flex; flex-direction:column; gap:5px; margin-bottom:9px}
.adminfield label{font-size:.72rem; color:var(--muted); font-weight:700}
.adminfield textarea{min-height:150px; font-family:ui-monospace,Consolas,monospace; font-size:.72rem; border-radius:12px; border:1px solid var(--stroke2); background:rgba(0,0,0,.35); color:var(--txt); padding:9px; width:100%}
.adminfield input[type=number],.adminfield input[type=text]{min-height:44px; border-radius:12px; border:1px solid var(--stroke2); background:rgba(0,0,0,.35); color:var(--txt); padding:8px 12px}

.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:0 0 auto}
.lg{height:20px;width:auto;flex:0 0 auto;display:block}.ap{width:28px;height:28px;flex:0 0 auto}
.gi{width:32px;height:20px;display:inline-grid;place-items:center;border-radius:6px;background:rgba(168,85,247,.16);color:var(--lav);flex:0 0 auto}
.oh{display:flex;gap:8px;align-items:flex-start}.oh .lg,.oh .gi{margin-top:1px}
.ck{position:absolute;top:8px;right:8px;color:var(--lav);display:grid}
.catico{color:var(--lav);display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:rgba(168,85,247,.14);border:1px solid var(--stroke)}
.catico .i{width:20px;height:20px}
.comp .st .i{width:14px;height:14px;stroke:#04060f;stroke-width:3}
.gname.wl{display:flex;gap:8px;align-items:center}
.case-frame{height:auto!important;border:0!important;background:none!important}
.case-stage{padding:6px;background:radial-gradient(ellipse at 50% 40%,rgba(139,92,246,.18),rgba(6,8,15,.9) 70%)}
.csvg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 22px rgba(139,92,246,.28))}
.spin{animation:spin 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.hue{animation:hue 7s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.drop{animation:dropin .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dropin{from{opacity:0;transform:translateY(-26px) scale(.96)}to{opacity:1;transform:none}}
body.lite .spin,body.lite .hue{animation:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:999px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);font-size:.68rem;color:var(--muted)}
.btn .i{width:1.2em;height:1.2em}

@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
@keyframes flow{to{background-position:250% 0}}
@keyframes halo{0%,100%{box-shadow:0 0 10px rgba(168,85,247,.35),0 0 0 0 rgba(217,70,239,.35)}50%{box-shadow:0 0 28px rgba(217,70,239,.75),0 0 0 8px rgba(217,70,239,0)}}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
@keyframes slide{to{transform:translateX(100%)}}
@keyframes glowp{0%,100%{box-shadow:0 0 12px rgba(168,85,247,.35)}50%{box-shadow:0 0 30px rgba(217,70,239,.85)}}
@keyframes dialg{0%,100%{filter:drop-shadow(0 0 5px rgba(168,85,247,.45))}50%{filter:drop-shadow(0 0 16px rgba(217,70,239,.9))}}
@keyframes drift{to{transform:translate(9vmax,6vmax) scale(1.15)}}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;background:radial-gradient(circle,rgba(168,85,247,.30),transparent 65%);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-18vmax;top:-20vmax}
.aurora i:nth-child(2){right:-22vmax;top:18vh;background:radial-gradient(circle,rgba(217,70,239,.22),transparent 65%);animation-duration:23s;animation-delay:-6s}
.aurora i:nth-child(3){left:20vw;bottom:-30vmax;background:radial-gradient(circle,rgba(34,211,238,.16),transparent 65%);animation-duration:27s;animation-delay:-11s}
#particles{opacity:.6}
.rgb:not(.topbar){position:relative}
.rgb::before,.opt.sel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;
 background:conic-gradient(from var(--ang),#a855f7,#d946ef,#22d3ee,#6366f1,#a855f7);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 4s linear infinite}
.opt.sel{box-shadow:0 0 18px rgba(168,85,247,.35),0 0 0 1px rgba(168,85,247,.5) inset}
.opt::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(150px circle at var(--mx,50%) var(--my,50%),rgba(217,70,239,.26),transparent 60%)}
.opt:hover::after{opacity:1}
h1 span{background-image:linear-gradient(90deg,#c4b5fd,#a855f7,#d946ef,#22d3ee,#c4b5fd);background-size:250% auto;animation:flow 6s linear infinite}
.logo{animation:glowp 2.6s ease-in-out infinite}
.btn.primary{background-image:linear-gradient(100deg,#a855f7,#d946ef,#6366f1,#a855f7);background-size:250% 100%;animation:flow 5s linear infinite,halo 2.4s ease-in-out infinite}
.btn.primary::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite}
.btn:not(.primary):hover{box-shadow:0 0 20px rgba(217,70,239,.5)}
.fps-row .fbar i,.bench .bar i{position:relative;overflow:hidden}
.fps-row .fbar i::after,.bench .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:slide 1.8s linear infinite}
.dial{animation:dialg 2.8s ease-in-out infinite}
.badge.excellent,.badge.great{background-size:200% 100%;animation:flow 3s linear infinite}
.part{filter:drop-shadow(0 0 4px rgba(168,85,247,.55))}
.spin{animation:spin 1.4s linear infinite,hue 4s linear infinite}
body.lite .aurora i,body.lite .rgb::before,body.lite .opt.sel::before,body.lite .btn.primary,body.lite .btn.primary::before,body.lite .dial,body.lite .logo,body.lite h1 span,body.lite .fbar i::after,body.lite .bench .bar i::after,body.lite .badge{animation:none!important}
body.lite .part{filter:none}
@media (prefers-reduced-motion:reduce){*::before,*::after{animation:none!important}}
.opt .pr{display:flex;flex-direction:column;gap:1px}.opt .pr .ar{font-size:.7rem;font-weight:700;color:#86efac}
.sec-head .hint{margin-left:auto;text-align:right}

html,body{overflow-x:clip}
.qrwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.qrwrap canvas{border-radius:14px;background:#fff;box-shadow:0 0 30px rgba(168,85,247,.5);image-rendering:pixelated;max-width:100%;height:auto}
.qrside{flex:1 1 220px;max-width:360px;font-size:.84rem;color:var(--muted);display:grid;gap:10px}
.qrcard h3{justify-content:center}

.glass.topbar{position:fixed!important;top:6px;left:0;right:0;margin:0 auto!important;width:1472px;max-width:calc(100% - 28px);border-radius:var(--r2);z-index:80}
body.kiosk .glass.topbar{width:1672px}

.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.pwr{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.meters{display:grid;gap:13px;min-width:0}
.mt .mh{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:5px}
.mt .mh b{color:var(--txt);font-weight:700;text-align:right}
.mt .mb{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.mt .mb i{display:block;height:100%;border-radius:9px;box-shadow:0 0 10px currentColor;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.pwr-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pwr-foot span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);font-size:.72rem;color:var(--muted)}
@media(max-width:480px){.pwr{grid-template-columns:1fr;justify-items:center}.meters{width:100%}}
.qrcard{text-align:center}
.qrwrap{flex-direction:column;gap:12px}
.qrside{max-width:none;width:100%;justify-items:center;text-align:center}
.qrside .btn{width:100%}
.rcol{align-self:start}.rcol>.card{flex:0 0 auto}.qrside{align-content:start}.qrside .btn{height:auto;min-height:48px;align-self:start}
.qrside{flex:0 0 auto!important}

<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="particles" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="glass topbar rgb" role="banner">
    <div class="brand">
      <div class="logo" aria-hidden="true"><b>PC</b></div>
      <div style="flex:1;min-width:200px">
        <h1><span>BUILD YOUR DREAM PC</span> — What is your FPS?</h1>
        <div class="sub" id="tagline">Armá tu PC, verificá compatibilidad y descubrí tus FPS.</div>
      </div>
      <div class="toolbar" style="flex-wrap:wrap">
        <button class="btn sm ghost" id="langBtn" aria-label="Cambiar idioma">ES</button>
        <button class="btn sm ghost" id="techBtn" aria-pressed="false"><span data-i18n="techMode">Technician Mode</span></button>
        <button class="btn sm ghost" id="liteBtn" aria-pressed="false"><span data-i18n="lite">Lite</span></button>
        <button class="btn sm ghost hide-kiosk" id="kioskBtn" aria-pressed="false"><span data-i18n="kiosk">Kiosco</span></button>
        <button class="btn sm ghost hide-kiosk" id="adminBtn"><span data-i18n="admin">Admin</span></button>
        <a class="btn sm ghost" id="glossaryBtn" href="Glosario de PC Gamer.html" aria-label="Glosario"><span data-i18n="glossary">Glosario</span></a>
      </div>
    </div>
    <div class="toolbar">
      <span class="badge-count"><span data-i18n="builds">Builds</span>: <b id="buildCount">0</b></span>
      <span class="badge-count" style="background:rgba(129,140,248,.16);border-color:rgba(129,140,248,.45);color:#dfe3ff">1 USD = <b id="rateMini">0</b> ARS</span>
      <div class="spacer"></div>
    </div>
  </header>

  <div class="layout">
    <main class="col-left" id="builder" aria-label="Componentes"></main>

    <aside class="col-right" aria-label="Resumen">
      <section class="glass casebox" aria-label="Gabinete virtual">
        <div class="sec-head"><h2 data-i18n="virtualCase">Gabinete virtual</h2></div>
        <div class="case-stage">
          <div class="case-frame" id="caseFrame"></div>
        </div>
        <div class="chips" id="caseChips"></div>
        <div class="case-cap">
          <span id="caseName">—</span>
          <span id="caseNote" class="kiosk-note"></span>
        </div>
      </section>

      <section class="glass summary rgb" aria-label="Resumen de precio">
        <div class="sec-head"><h2 data-i18n="summary">Resumen</h2></div>
        <div class="sumrow"><span class="k" data-i18n="totalUsd">Total USD</span><span class="v usd" id="sumUsd">$0</span></div>
        <div class="sumrow"><span class="k" data-i18n="totalArs">Total ARS</span><span class="v ars" id="sumArs">$0</span></div>
        <div class="sumrow"><span class="k" data-i18n="maxBudget">Presupuesto máx (USD)</span><span class="v" id="budgetStatus">—</span></div>
        <div class="rate">
          <label class="sr" for="rateInput">Cotización ARS</label>
          <input id="rateInput" type="number" min="1" step="10" inputmode="numeric" aria-label="Cotización ARS por USD">
          <label class="sr" for="budgetInput">Presupuesto</label>
          <input id="budgetInput" type="number" min="0" step="50" inputmode="numeric" placeholder="Budget" aria-label="Presupuesto máximo">
        </div>
        <div class="comp-list" id="compatList" aria-live="polite" style="margin-top:12px"></div>
        <div class="presets" id="presets" aria-label="Presets">
          <button class="btn sm ghost" data-preset="budget"><span data-i18n="pBudget">Budget</span></button>
          <button class="btn sm ghost" data-preset="esports"><span data-i18n="pEsports">Esports</span></button>
          <button class="btn sm ghost" data-preset="mid"><span data-i18n="pMid">Mid-range</span></button>
          <button class="btn sm ghost" data-preset="high"><span data-i18n="pHigh">High-end</span></button>
          <button class="btn sm ghost" data-preset="creator"><span data-i18n="pCreator">Creator</span></button>
        </div>
        <div class="actions">
          <button class="btn primary wide" id="calcBtn"><span data-i18n="calculate">Calculate my FPS</span></button>
          <button class="btn ghost" id="surpriseBtn"><span data-i18n="surprise">Surprise me</span></button>
          <button class="btn ghost" id="printBtn"><span data-i18n="budget">Ficha BUDGET</span></button>
          <button class="btn ghost" id="compareBtn"><span data-i18n="compare">Comparar</span></button>
          <button class="btn ghost" id="resetBtn"><span data-i18n="reset">Reiniciar</span></button>
        </div>
      </section>

      <section class="glass techonly" id="techPanel" aria-label="Technician mode">
        <div class="techphrase" id="techPhrase">—</div>
      </section>
    </aside>
  </div>
</div>

<div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-label="Resultados">
  <div class="glass box rgb">
    <button class="btn sm close" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg> <span data-i18n="close">Cerrar</span></button>
    <div id="resultBody"></div>
  </div>
</div>

<div class="modal" id="cardModal" role="dialog" aria-modal="true" aria-label="Glosario">
  <div class="glass box">
    <button class="btn sm close" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sec-head"><h2 data-i18n="drawCard">Draw a card</h2><span class="hint" id="cardCount"></span></div>
    <div class="glossary" id="cardBody"></div>
    <div class="tbl-actions"><button class="btn primary" id="drawAgain"><span data-i18n="drawAgain">Otra carta</span></button></div>
  </div>
</div>

<div class="modal" id="compareModal" role="dialog" aria-modal="true" aria-label="Comparar">
  <div class="glass box">
    <button class="btn sm close" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sec-head"><h2 data-i18n="compare">Comparar builds</h2><span class="hint" id="savedCount"></span></div>
    <div class="saved" id="savedList"></div>
    <div class="cmp-grid" id="cmpBody"></div>
  </div>
</div>

<div class="modal" id="adminModal" role="dialog" aria-modal="true" aria-label="Admin">
  <div class="glass box slim">
    <button class="btn sm close" data-close><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sec-head"><h2 data-i18n="admin">Panel Admin</h2></div>
    <div id="adminLock">
      <div class="adminfield"><label for="pinInput" data-i18n="enterPin">PIN de acceso</label><input id="pinInput" type="password" inputmode="numeric" autocomplete="off"></div>
      <button class="btn primary" id="pinGo"><span data-i18n="unlock">Desbloquear</span></button>
    </div>
    <div id="adminPanel" hidden>
      <div class="adminfield"><label for="adminRate" data-i18n="rateLabel">Cotización ARS por USD</label><input id="adminRate" type="number" min="1" step="10"></div>
      <div class="adminfield"><label for="adminPin" data-i18n="newPin">Nuevo PIN</label><input id="adminPin" type="text" inputmode="numeric" placeholder="1234"></div>
      <div class="adminfield"><label><input type="checkbox" id="adminIdle" style="min-height:auto"> <span data-i18n="idleReset">Reinicio automático a 90 s</span></label></div>
      <div class="adminfield"><label for="adminDb" data-i18n="editDb">Editor DB (JSON)</label><textarea id="adminDb" spellcheck="false"></textarea></div>
      <div class="tbl-actions">
        <button class="btn primary" id="saveAdmin"><span data-i18n="save">Guardar</span></button>
        <button class="btn ghost" id="restoreAdmin"><span data-i18n="restore">Restaurar DB</span></button>
        <button class="btn danger" id="resetCounter"><span data-i18n="resetCounter">Reset contador</span></button>
      </div>
    </div>
  </div>
</div>

<section class="printsheet" id="printSheet" aria-hidden="true"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

              bytes.push(b & 0xff);

function specTags(cat, it){
  if(!it) return [];
  const tags = [];
  if(cat === "cpu"){ tags.push({txt:it.socket, cls:"d5"}); tags.push({txt:it.cores+"c/"+it.th+"t"}); tags.push({txt:it.tdp+"W", cls:"warn"}); }
  if(cat === "mobo"){ tags.push({txt:it.socket, cls:"d5"}); tags.push({txt:it.ddr, cls:it.ddr==="DDR5"?"d5":"d4"}); tags.push({txt:it.form}); if(it.ryzen5kNoBios) tags.push({txt:"BIOS", cls:"warn"}); }
  if(cat === "ram"){ tags.push({txt:it.ddr, cls:it.ddr==="DDR5"?"d5":"d4"}); tags.push({txt:it.gb+"GB"}); tags.push({txt:it.channels===2?"Dual":"Single", cls:it.channels===2?"":"warn"}); tags.push({txt:it.speed}); }
  if(cat === "gpu"){ tags.push({txt:it.vram+"GB VRAM"}); tags.push({txt:it.power+"W", cls:"warn"}); tags.push({txt:it.len+"mm"}); tags.push({txt:it.base+" base"}); }
  if(cat === "storage"){ tags.push({txt:it.type}); tags.push({txt:it.gb+"GB"}); }
  if(cat === "psu"){ tags.push({txt:it.watt+"W"}); tags.push({txt:it.eff}); }
  if(cat === "cooling"){ tags.push({txt:"Nivel "+it.level}); tags.push({txt:it.tdp+"W", cls:"warn"}); tags.push({txt:it.aio?"AIO":"Aire"}); }
  if(cat === "case"){ tags.push({txt:it.supports.join("/")}); tags.push({txt:"GPU "+it.maxGpu+"mm"}); tags.push({txt:"Cooler "+it.maxCooler+"mm"}); }
  if(cat === "monitor"){ tags.push({txt:it.res}); tags.push({txt:it.hz+"Hz"}); if(it.hz<100) tags.push({txt:"60Hz", cls:"warn"}); }
  return tags;
}

function totals(){
  let sum = 0, count = 0;
  ALL_CATS.forEach(c => {
    if(c === "extras"){ selExtras().forEach(x => { sum += x.price; count++; }); return; }
    const it = selItem(c); if(it){ sum += it.price; count++; }
  });
  return {sum, count};
}

function countUp(el, to, render){
  if(!el) return;
  if(liteActive()){ el.textContent = render(to); el.dataset.v = to; return; }
  const from = parseFloat(el.dataset.v || "0") || 0;
  el.dataset.v = to;
  const t0 = performance.now(), dur = 450;
  cancelAnimationFrame(el._raf);
  (function loop(now){
    const k = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = render(from + (to - from) * e);
    if(k < 1) el._raf = requestAnimationFrame(loop);
  })(performance.now());
}

function compat(){
  const r = [];
  const cpu = selItem("cpu"), mobo = selItem("mobo"), ram = selItem("ram"), gpu = selItem("gpu");
  const psu = selItem("psu"), cool = selItem("cooling"), kase = selItem("case"), mon = selItem("monitor");
  const add = (lvl, txt, tag) => r.push({lvl, txt, tag});

  if(cpu && mobo){
    if(cpu.socket === mobo.socket) add("ok", "Socket " + cpu.socket + " — " + mobo.name, "socket");
    else add("bad", "Socket " + cpu.socket + " ≠ " + mobo.socket + " (CPU no entra en la placa)", "socket");
  }
  if(cpu && mobo && cpu.ryzen5k && mobo.ryzen5kNoBios){
    add("warn", "Ryzen 5000 en A320M: requiere actualizar BIOS", "bios");
  }
  if(ram && mobo){
    if(ram.ddr === mobo.ddr) add("ok", ram.ddr + " compatible con la placa", "ddr");
    else add("bad", ram.ddr + " no entra en placa " + mobo.ddr, "ddr");
  }
  if(ram && ram.channels === 1){
    add("warn", "RAM monocanal: perdés ~10-15% de FPS (usá 2 módulos)", "chan");
  } else if(ram && ram.channels === 2){
    add("ok", "RAM dual channel: ancho de banda completo", "chan");
  }
  if(mobo && kase){
    if(kase.supports.indexOf(mobo.form) >= 0) add("ok", "Placa " + mobo.form + " entra en " + kase.name, "form");
    else add("bad", "Placa " + mobo.form + " NO entra en " + kase.name + " (" + kase.supports.join("/") + ")", "form");
  }
  if(gpu && kase){
    if(gpu.len <= kase.maxGpu) add("ok", "GPU " + gpu.len + "mm (máx " + kase.maxGpu + "mm)", "glen");
    else add("bad", "GPU " + gpu.len + "mm demasiado larga para " + kase.name + " (máx " + kase.maxGpu + "mm)", "glen");
  }
  if(cool && kase){
    if(cool.aio) add("ok", "AIO " + cool.name + " compatible con " + kase.name, "chgt");
    else if(cool.height <= kase.maxCooler) add("ok", "Cooler " + cool.height + "mm (máx " + kase.maxCooler + "mm)", "chgt");
    else add("bad", "Cooler " + cool.height + "mm no entra en " + kase.name + " (máx " + kase.maxCooler + "mm)", "chgt");
  }
  if(cool && cpu){
    if(cool.tdp >= cpu.tdp) add("ok", "Cooler disipa " + cool.tdp + "W para CPU " + cpu.tdp + "W", "ctdp");
    else add("bad", "Cooler " + cool.tdp + "W insuficiente para CPU de " + cpu.tdp + "W", "ctdp");
  }
  if(psu && cpu && gpu){
    const need = Math.ceil((cpu.tdp + gpu.power + 100) * 1.2);
    if(psu.watt >= need) add("ok", "Fuente " + psu.watt + "W (necesitás ~" + need + "W)", "psu");
    else add("bad", "Fuente " + psu.watt + "W insuficiente: necesitás ~" + need + "W", "psu");
  }
  if(mon && gpu && cpu){
    const g = gpu.base;
    if(mon.hz <= 75 && g >= 120) add("warn", "Monitor " + mon.hz + "Hz limita una GPU potente", "hz");
    else if(mon.hz >= 144 && g < 80) add("warn", "GPU modesta para monitor " + mon.hz + "Hz", "hz");
    else add("ok", "Monitor " + mon.hz + "Hz acorde al equipo", "hz");
  }
  const missing = ALL_CATS.filter(c => ["cpu","mobo","ram","gpu","storage","psu","cooling","case","monitor"].indexOf(c) >= 0 && !state.sel[c]);
  if(missing.length) add("warn", t("missing") + ": " + missing.map(catLabel).join(", "), "miss");
  else if(r.length) add("ok", t("complete"), "miss");
  return r;
}

function ramFactor(){
  const ram = selItem("ram"); if(!ram) return 0.9;
  let f = ram.channels === 2 ? 1.0 : 0.86;
  if(ram.ddr === "DDR5") f += 0.04;
  if(ram.gb < 16) f -= 0.06;
  return Math.max(0.6, f);
}
function thermalFactor(){
  const cpu = selItem("cpu"), cool = selItem("cooling");
  if(!cpu) return 0.95;
  if(!cool) return 0.85;
  return cool.tdp >= cpu.tdp ? 1.0 : 0.85;
}
function ramScore(){ const r = selItem("ram"); return r ? Math.min(100, r.gb / 64 * 100 + (r.channels === 2 ? 8 : 0)) : 40; }
function cpuScore(){ const c = selItem("cpu"); return c ? Math.min(100, c.cap / 3.0) : 40; }
function gpuScore(){ const g = selItem("gpu"); return g ? Math.min(100, g.base / 2.6) : 30; }

function fpsFor(game, monitor){
  const gpu = selItem("gpu"), cpu = selItem("cpu");
  if(!gpu || !cpu) return 0;
  const rf = ramFactor(), tf = thermalFactor();
  const gfps = gpu.base / game.gpu * (monitor ? monitor.resFactor : 1);
  const cfps = cpu.cap / game.cpu;
  const raw = Math.min(gfps, cfps) * rf * tf;
  const capped = monitor ? Math.min(raw, monitor.hz) : raw;
  return {raw: raw, fps: Math.max(1, Math.round(capped)), limited: monitor && raw > monitor.hz};
}

function fpsVerdict(fps){
  if(fps >= 144) return "excellent";
  if(fps >= 100) return "great";
  if(fps >= 60) return "decent";
  if(fps >= 30) return "playable";
  return "notgood";
}
function scoreVerdict(s){
  if(s >= 85) return "excellent";
  if(s >= 70) return "great";
  if(s >= 50) return "decent";
  if(s >= 30) return "playable";
  return "notgood";
}

function progScore(p){
  const s = gpuScore() * p.gw + cpuScore() * p.cw + ramScore() * p.rw;
  return Math.max(0, Math.min(100, Math.round(s * (ramFactor() * 0.5 + thermalFactor() * 0.5) / 1)));
}

function analyze(){
  const monitor = selItem("monitor");
  const gameFps = GAMES.map(g => ({g, r: fpsFor(g, monitor)}));
  const progs = PROGRAMS.map(p => ({p, s: progScore(p)}));
  const gameAvg = gameFps.reduce((a, x) => a + Math.min(1, x.r.fps / 144), 0) / gameFps.length * 100;
  const prodAvg = progs.reduce((a, x) => a + x.s, 0) / progs.length;

  const gpu = selItem("gpu"), cpu = selItem("cpu");
  let bottleneck = 0, limiting = "balanced";
  if(gpu && cpu){
    const gp = gpu.base, cp = cpu.cap;
    bottleneck = Math.round(Math.abs(gp - cp) / Math.max(gp, cp) * 100);
    limiting = gp < cp ? "gpu" : cp < gp ? "cpu" : "balanced";
  }
  const bLvl = bottleneck < 10 ? "low" : bottleneck < 20 ? "mild" : bottleneck < 35 ? "moderate" : "severe";
  const balanceScore = 100 - bottleneck;
  const score = Math.round(gameAvg * 0.5 + prodAvg * 0.3 + balanceScore * 0.2);

  const cool = selItem("cooling");
  const totalW = (cpu ? cpu.tdp : 0) + (gpu ? gpu.power : 0) + 70;
  const cpuTemp = cpu ? Math.round(40 + cpu.tdp / Math.max(40, (cool ? cool.tdp : 65)) * 45) : 0;
  const gpuTemp = gpu ? Math.round(58 + gpu.power / 22) : 0;

  let upgrade = "—";
  if(limiting === "gpu"){ const u = DB.gpu.find(x => x.base > (gpu ? gpu.base : 0) && x.price <= (gpu ? gpu.price : 0) * 1.9); upgrade = u ? u.name : "GPU más potente"; }
  else if(limiting === "cpu"){ const u = DB.cpu.find(x => x.socket === (cpu ? cpu.socket : "") && x.cap > (cpu ? cpu.cap : 0)); upgrade = u ? u.name : "CPU más potente"; }
  else if(selItem("ram") && selItem("ram").channels === 1) upgrade = "2° módulo de RAM (dual channel)";
  else upgrade = "Equipo equilibrado: no urgente";

  return {gameFps, progs, gameAvg, prodAvg, bottleneck, bLvl, limiting, score, totalW, cpuTemp, gpuTemp, upgrade, verdict: scoreVerdict(score)};
}

function surprise(){
  const rnd = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const cpu = rnd(DB.cpu);
  const mobos = DB.mobo.filter(m => m.socket === cpu.socket);
  const mobo = rnd(mobos.length ? mobos : DB.mobo);
  const rams = DB.ram.filter(r => r.ddr === mobo.ddr);
  const ram = rnd(rams.length ? rams : DB.ram);
  const gpu = rnd(DB.gpu);
  const cases = DB.case.filter(c => c.supports.indexOf(mobo.form) >= 0 && gpu.len <= c.maxGpu);
  const kase = rnd(cases.length ? cases : DB.case);
  const cool = rnd(DB.cooling.filter(c => c.tdp >= cpu.tdp && (c.aio || c.height <= kase.maxCooler)));
  const need = Math.ceil((cpu.tdp + gpu.power + 100) * 1.2);
  const psu = DB.psu.find(p => p.watt >= need) || DB.psu[DB.psu.length - 1];
  state.sel = {
    cpu:cpu.id, mobo:mobo.id, ram:ram.id, gpu:gpu.id, storage:rnd(DB.storage).id, psu:psu.id,
    cooling:(cool || rnd(DB.cooling)).id, case:kase.id, monitor:rnd(DB.monitor).id,
    keyboard:rnd(DB.keyboard).id, mouse:rnd(DB.mouse).id, headset:rnd(DB.headset).id, extras:[rnd(DB.extras).id]
  };

}

function benchmark(done){

  const total = reduce ? 300 : 2400;
  let p = 0, li = 0;
  $("#resultBody").innerHTML = '<div class="bench"><div class="sec-head" style="justify-content:center"><h2>' + t("bench") + '…</h2></div>'
    + '<div class="pct" id="benchPct">0%</div><div class="bar"><i id="benchBar"></i></div><div class="log" id="benchLog"></div></div>';
  const step = Math.max(16, total / 60);
  const iv = setInterval(() => {
    p = Math.min(100, p + (100 / (total / step)));
    const bar = $("#benchBar"), pct = $("#benchPct"), log = $("#benchLog");
    if(bar) bar.style.width = p + "%";
    if(pct) pct.textContent = Math.round(p) + "%";

    if(log && target > li){ const d = document.createElement("div"); d.textContent = "> " + logs[li]; log.appendChild(d); log.scrollTop = log.scrollHeight; li++; }
    if(p >= 100){ clearInterval(iv); setTimeout(done, reduce ? 60 : 240); }
  }, step);
}

let confTimer = null;
function burstConfetti(){
  const c = $("#confetti"); c.classList.add("on");
  const ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#a855f7", "#d946ef", "#c084fc", "#818cf8", "#e9d5ff"];
  const parts = Array.from({length: 110}, () => ({x: Math.random() * c.width, y: -20 - Math.random() * c.height * .4, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, s: 4 + Math.random() * 6, r: Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)]}));
  cancelAnimationFrame(confTimer);
  const t0 = performance.now();
  (function loop(now){
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(pp => { pp.y += pp.vy; pp.x += pp.vx; pp.r += .12;
      ctx.save(); ctx.translate(pp.x, pp.y); ctx.rotate(pp.r); ctx.fillStyle = pp.c; ctx.fillRect(-pp.s / 2, -pp.s / 2, pp.s, pp.s * .6); ctx.restore(); });
    if(now - t0 < 2600) confTimer = requestAnimationFrame(loop); else { ctx.clearRect(0, 0, c.width, c.height); c.classList.remove("on"); }
  })(t0);
}

function particles(){
  if(reduce) return;
  const c = $("#particles"), ctx = c.getContext("2d");
  let ps = [], w = 0, h = 0, last = 0;
  function size(){
    w = c.width = innerWidth; h = c.height = innerHeight;
    const n = Math.min(24, Math.max(10, Math.round(w / 64)));
    ps = Array.from({length: n}, () => ({x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22, r: .7 + Math.random() * 1.5}));
  }
  size(); addEventListener("resize", size);
  function loop(now){
    requestAnimationFrame(loop);
    if(document.hidden || document.body.classList.contains("lite")) return;
    if(now - last < 45) return;
    last = now;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(168,85,247,.35)";
    for(let i = 0; i < ps.length; i++){
      const p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = w; else if(p.x > w) p.x = 0;
      if(p.y < 0) p.y = h; else if(p.y > h) p.y = 0;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    ctx.lineWidth = 1;
    for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
      const dx = ps[i].x - ps[j].x, dy = ps[i].y - ps[j].y, d = dx * dx + dy * dy;
      if(d < 14000){ ctx.strokeStyle = "rgba(217,70,239," + (0.28 * (1 - d / 14000)) + ")"; ctx.beginPath(); ctx.moveTo(ps[i].x, ps[i].y); ctx.lineTo(ps[j].x, ps[j].y); ctx.stroke(); }
    }
  }
  requestAnimationFrame(loop);
}

function enhance(root){
  $$(".btn, .opt", root).forEach(el => {
    if(el._enh) return; el._enh = true;
    el.addEventListener("pointerdown", e => {
      if(liteActive()) return;
      const rect = el.getBoundingClientRect();
      const s = document.createElement("span"); s.className = "ripple";
      const size = Math.max(rect.width, rect.height);
      s.style.width = s.style.height = size + "px";
      s.style.left = (e.clientX - rect.left - size / 2) + "px";
      s.style.top = (e.clientY - rect.top - size / 2) + "px";
      el.appendChild(s); setTimeout(() => s.remove(), 620);
    });
  });
}

function openModal(sel){ const m = $(sel); m.classList.add("open"); const b = m.querySelector(".close"); if(b) b.focus(); }
function closeModal(m){ m.classList.remove("open"); }

function bind(){
  $("#builder").addEventListener("click", e => {
    const opt = e.target.closest(".opt"); if(!opt) return;
    const cat = opt.dataset.cat, id = opt.dataset.id;
    if(cat === "extras"){
      let arr = (state.sel.extras || []).slice();
      if(id === "ex-none"){ arr = []; }
      else{
        arr = arr.filter(x => x !== "ex-none");
        const i = arr.indexOf(id);
        if(i >= 0) arr.splice(i, 1); else arr.push(id);
      }
      if(arr.length) state.sel.extras = arr; else delete state.sel.extras;
    } else {
      state.sel[cat] = state.sel[cat] === id ? undefined : id;
      if(!state.sel[cat]) delete state.sel[cat];
    }
    persistSel(); renderBuilder(); updateSummary(); idlePing();
  });

  $("#presets").addEventListener("click", e => {
    const b = e.target.closest("[data-preset]"); if(!b) return;
    preset(b.dataset.preset); idlePing();
  });

  $("#calcBtn").addEventListener("click", calculate);
  $("#surpriseBtn").addEventListener("click", () => { surprise(); idlePing(); });
  $("#resetBtn").addEventListener("click", resetBuild);
  $("#printBtn").addEventListener("click", doPrint);
  $("#drawAgain").addEventListener("click", drawCard);
  $("#compareBtn").addEventListener("click", () => { renderSaved(); openModal("#compareModal"); });

  $("#langBtn").addEventListener("click", () => {
    state.lang = state.lang === "es" ? "en" : "es";
    localStorage.setItem("bydp_lang", state.lang);
    document.documentElement.lang = state.lang;
    $("#langBtn").textContent = state.lang.toUpperCase();
    refreshText(); renderBuilder(); updateSummary();
  });

  $("#techBtn").addEventListener("click", () => {
    const on = document.body.classList.toggle("techmode");
    $("#techBtn").setAttribute("aria-pressed", String(on));
    toast(on ? t("techOn") : t("techOff"));
    if(on){
      if(state.lastResult) updTechPhrase(state.lastResult.a, state.lastResult.sum);
      else { const box = $("#techPhrase"); if(box) box.textContent = t("techHint"); }
    }
  });

  $("#liteBtn").addEventListener("click", () => {
    const on = document.body.classList.toggle("lite");
    $("#liteBtn").setAttribute("aria-pressed", String(on));
    toast(on ? t("liteOn") : t("liteOff"));
  });

  $("#kioskBtn").addEventListener("click", () => {
    const on = document.body.classList.toggle("kiosk");
    $("#kioskBtn").setAttribute("aria-pressed", String(on));
    toast(on ? t("kioskOn") : t("kioskOff"));
    try { if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); else if(!on && document.fullscreenElement) document.exitFullscreen(); } catch(e){}
  });

  $("#rateInput").addEventListener("input", e => { const v = parseFloat(e.target.value); if(!(v >= 100)) return; state.rate = v; localStorage.setItem("bydp_rate", String(v)); updateSummary(); });
  $("#budgetInput").addEventListener("input", e => { state.budget = Math.max(0, parseFloat(e.target.value) || 0); localStorage.setItem("bydp_budget", String(state.budget)); updateSummary(); });

  $("#adminBtn").addEventListener("click", () => { $("#adminLock").hidden = false; $("#adminPanel").hidden = true; $("#pinInput").value = ""; openModal("#adminModal"); $("#pinInput").focus(); });
  $("#pinGo").addEventListener("click", () => {
    if($("#pinInput").value === state.pin){ $("#adminLock").hidden = true; $("#adminPanel").hidden = false; fillAdmin(); toast(t("adminOk")); }
    else toast(t("adminBad"));
  });
  $("#pinInput").addEventListener("keydown", e => { if(e.key === "Enter") $("#pinGo").click(); });
  $("#saveAdmin").addEventListener("click", () => {
    try {
      const r = parseFloat($("#adminRate").value); if(r > 0){ state.rate = r; localStorage.setItem("bydp_rate", String(r)); }
      const np = $("#adminPin").value.trim(); if(np){ state.pin = np; localStorage.setItem("bydp_pin", np); }
      state.idleReset = $("#adminIdle").checked; localStorage.setItem("bydp_idle", state.idleReset ? "1" : "0");
      const parsed = JSON.parse($("#adminDb").value);
      Object.keys(parsed).forEach(k => { DB[k] = parsed[k]; });
      updateSummary(); toast(t("dbSaved"));
    } catch(err){ toast("JSON: " + err.message); }
  });
  $("#restoreAdmin").addEventListener("click", () => { Object.keys(DEFAULT_DB).forEach(k => { DB[k] = JSON.parse(JSON.stringify(DEFAULT_DB[k])); }); fillAdmin(); renderBuilder(); updateSummary(); toast(t("dbRestored")); });
  $("#resetCounter").addEventListener("click", () => { state.builds = 0; state.cardNo = 1000; localStorage.setItem("bydp_builds", "0"); localStorage.setItem("bydp_cards", "1000"); $("#buildCount").textContent = 0; toast(t("counterReset")); });

  $$("[data-close]").forEach(b => b.addEventListener("click", () => closeModal(b.closest(".modal"))));
  $$(".modal").forEach(m => m.addEventListener("click", e => { if(e.target === m) closeModal(m); }));
  addEventListener("keydown", e => { if(e.key === "Escape") $$(".modal.open").forEach(closeModal); });

  ["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, idlePing, {passive:true}));
  addEventListener("resize", () => { const c = $("#confetti"); c.width = innerWidth; c.height = innerHeight; });
}

function fillAdmin(){
  $("#adminRate").value = state.rate;
  $("#adminPin").value = state.pin;
  $("#adminIdle").checked = state.idleReset;
  $("#adminDb").value = JSON.stringify(DB, null, 1);
}

let idleTimer = null, idleLeft = 90;
function idlePing(){ if(!state.idleReset) return; idleLeft = 90; }
function idleTick(){
  if(state.idleReset && !document.querySelector(".modal.open")){
    idleLeft = Math.max(0, idleLeft - 1);
    const bar = $("#idleBar"); if(bar) bar.style.transform = "scaleX(" + (idleLeft / 90) + ")";
    if(idleLeft === 0){ resetBuild(); idleLeft = 90; }
  }
}

function refreshText(){
  document.documentElement.lang = state.lang;
  $("#tagline").textContent = t("tagline");
  $("#budgetInput").placeholder = state.lang === "es" ? "Presupuesto" : "Budget";
  $$("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if(I18N[state.lang][k]) el.textContent = I18N[state.lang][k]; });
  renderBuilder(); updateSummary();
}

function syncSticky(){
  const tb = $(".glass.topbar");
  if(!tb) return;
  const h = Math.ceil(tb.getBoundingClientRect().height) + 6;
  if(h > 40) document.documentElement.style.setProperty("--tb", h + "px");
}

function applyKioskFromHash(){
  if(location.hash === "#kiosk"){
    if(!document.body.classList.contains("kiosk")){
      document.body.classList.add("kiosk");
      const kb = $("#kioskBtn");
      if(kb) kb.setAttribute("aria-pressed", "true");
    }
  }
}

function init(){
  document.documentElement.lang = state.lang;
  $("#langBtn").textContent = state.lang.toUpperCase();
  $("#rateInput").value = state.rate;
  $("#budgetInput").value = state.budget || "";
  $("#buildCount").textContent = state.builds;
  applyKioskFromHash();
  decorate();
  loadSel();
  bind();
  enhance(document);
  refreshText();
  renderSaved();
  particles();
  syncSticky();
  addEventListener("resize", syncSticky);
  addEventListener("hashchange", applyKioskFromHash);
  setTimeout(syncSticky, 300);
  setInterval(idleTick, 1000);
  idlePing();
}

function buildDoc(){
 const es=state.lang==="es",a=analyze(),sum=totals().sum,L=[];
 const nm=x=>x.replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim();
 const line=(lb,it)=>lb+": "+nm(it.name)+" | USD "+fmt(it.price)+" | ARS "+fmt(it.price*state.rate);
 L.push("BUILD YOUR DREAM PC - Expo Tecnica 2026",new Date().toLocaleDateString(es?"es-AR":"en-US"),"");
 ALL_CATS.forEach(c=>{const it=selItem(c);if(it&&c!=="extras")L.push(line(catLabel(c),it));});
 selExtras().forEach(it=>L.push(line(catLabel("extras"),it)));
 L.push("TOTAL: USD "+fmt(sum)+" | ARS "+fmt(sum*state.rate)+" (1 USD = ARS "+fmt(state.rate)+")","");
 const avg=Math.round(a.gameFps.reduce((q,x)=>q+x.r.fps,0)/a.gameFps.length);
 L.push((es?"Puntaje: ":"Score: ")+a.score+"/100 - "+t("verdicts")[a.verdict]);
 L.push("FPS "+(es?"promedio: ":"avg: ")+avg+" | Bottleneck: "+a.bottleneck+"% | "+a.totalW+"W");
 L.push(a.gameFps.map(x=>x.g.name+" "+Math.round(x.r.fps)).join(", "));
 L.push((es?"Alertas de compatibilidad: ":"Compatibility alerts: ")+compat().filter(c=>c.lvl!=="ok").length);
 return L.join("\n");
}
function drawQR(txt,cv){
 qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
 let qr=null;
 for(const lv of ["M","L"]){try{qr=qrcode(0,lv);qr.addData(txt);qr.make();break;}catch(e){qr=null;}}
 if(!qr){cv.replaceWith(document.createTextNode("QR: too much data"));return;}
 const n=qr.getModuleCount(),qz=3,cell=Math.max(3,Math.floor(Math.min(300,innerWidth-70)/(n+2*qz))),size=(n+2*qz)*cell;
 cv.width=cv.height=size;const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,size,size);g.fillStyle="#000";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))g.fillRect((k+qz)*cell,(r+qz)*cell,cell,cell);
}
function injectQR(){
 const hero=document.querySelector("#resultBody .card.hero");if(!hero)return;
 const es=state.lang==="es",txt=buildDoc(),card=document.createElement("div");
 card.className="card qrcard rgb";card.style.gridColumn="1/-1";
 card.innerHTML="<h3>"+ic("file")+" "+(es?"Llevate tu PC al celular":"Take your PC with you")+"</h3><div class=\"qrwrap\"><canvas id=\"qrCanvas\"></canvas><div class=\"qrside\"><div>"
  +(es?"Escaneá este QR con la cámara de tu celular: vas a recibir un documento con tus piezas, precios en USD y ARS, FPS y veredicto.":"Scan this QR with your phone camera: you get a document with your parts, USD and ARS prices, FPS and verdict.")
  +"</div><button class=\"btn\" id=\"qrDl\">"+ic("file")+"<span>"+(es?"Descargar documento (.txt)":"Download document (.txt)")+"</span></button></div></div>";
 {const grid=hero.parentElement,cards=[...grid.children].filter(x=>x.classList.contains("card")&&x!==hero);
  if(cards.length===5){const[g1,g2,pr,pw,cp]=cards,A=document.createElement("div"),B=document.createElement("div");A.className=B.className="rcol";card.style.gridColumn="";A.append(g1,pr);B.append(g2,pw,card);cp.before(A);cp.before(B);}else grid.appendChild(card);}
 drawQR(txt,card.querySelector("#qrCanvas"));
 card.querySelector("#qrDl").onclick=()=>{const u=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download="Dream-PC.txt";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);};
}
const _rr=renderResults;
renderResults=function(){_rr.apply(null,arguments);try{injectQR();}catch(e){console.error(e);}};


(function(){
 const h=document.querySelector(".topbar"),w=document.querySelector(".wrap");
 if(!h||!w)return;
 const fit=()=>{w.style.paddingTop=(h.offsetHeight+20)+"px";};
 fit();addEventListener("resize",fit);
 if(window.ResizeObserver)new ResizeObserver(fit).observe(h);
})();

document.addEventListener("pointermove", e => {
  if(liteActive()) return;
  const el = e.target.closest && e.target.closest(".opt"); if(!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", (e.clientX - r.left) + "px"); el.style.setProperty("--my", (e.clientY - r.top) + "px");
}, {passive:true});
document.addEventListener("DOMContentLoaded", init);
</script>
